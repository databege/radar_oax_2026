<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar · Dataquimia</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#020617;--bg2:#0b1220;--card:#0f172a;--card2:#111c33;--line:#1e293b;--line2:#334155;--tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;--ac:#3b82f6;--ac2:#60a5fa;--red:#f87171;--amb:#fbbf24;--grn:#4ade80;--vio:#a78bfa;--shadow:0 6px 24px rgba(0,0,0,.35)}
html[data-theme=light]{--bg:#f1f5f9;--bg2:#e2e8f0;--card:#ffffff;--card2:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;--tx:#0f172a;--tx2:#475569;--tx3:#64748b;--ac:#2563eb;--ac2:#1d4ed8;--red:#dc2626;--amb:#b45309;--grn:#15803d;--vio:#6d28d9;--shadow:0 6px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:60px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.hdr .l{display:flex;align-items:center;gap:10px;min-width:0}
.hdr img{height:20px;width:auto;display:block}
.hdr .sep{width:1px;height:26px;background:var(--line2)}
.hdr .tt{min-width:0}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ac2);background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);padding:1px 7px;border-radius:6px;white-space:nowrap}
.hdr h1{font-size:13px;font-weight:700;line-height:1.25;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .r{display:flex;gap:6px;flex-shrink:0}
.ib{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:7px 9px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--tx2);transition:.15s}
.ib:hover{color:var(--tx);border-color:var(--ac)}
.ib svg{width:15px;height:15px}
nav{position:sticky;top:57px;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tb{flex:1 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px;border:0;border-radius:11px;background:transparent;color:var(--tx2);font-size:11px;font-weight:500;transition:.15s}
.tb svg{width:17px;height:17px}
.tb:hover{background:var(--card2);color:var(--tx)}
.tb.on{background:var(--ac);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 45%,transparent)}
main{max-width:1000px;margin:0 auto;padding:16px}
.tab{display:none}.tab.on{display:block;animation:fade .35s ease}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.hdr h1{white-space:normal}.hdr .ib span{display:none}}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:11px;color:var(--tx3);margin-bottom:10px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--tx3)}
.banner{border-radius:16px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--red) 30%,var(--line));border-left:4px solid var(--red);background:linear-gradient(90deg,color-mix(in srgb,var(--red) 12%,var(--card)),var(--card))}
.banner h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.banner p{font-size:13.5px;color:var(--tx);line-height:1.6}
.dec{margin:10px 0 0;padding:0;list-style:none}
.dec li{display:flex;gap:8px;font-size:12.5px;color:var(--tx2);padding:3px 0}
.dec li:before{content:"▸";color:var(--red)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:10.5px;color:var(--tx3);margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.tone-rojo .v{color:var(--red)}.tone-ambar .v{color:var(--amb)}.tone-verde .v{color:var(--grn)}.tone-azul .v{color:var(--ac2)}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--tx2);line-height:1.55}
ul.clean li:last-child{border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:var(--card2);color:var(--tx2);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ac)}
.chip.on{background:color-mix(in srgb,var(--ac) 18%,var(--card));border-color:var(--ac);color:var(--tx)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap}
svg text{font-family:inherit;fill:var(--tx2)}
.ch{width:100%;position:relative}
.ch svg{display:block;width:100%;overflow:visible}
.axis text{font-size:10.5px}
.gl{stroke:var(--line);stroke-width:1}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--card2);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.45;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s}
#tip b{display:block;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--card2)}
.tw{overflow-x:auto}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hm td{padding:0}
.det{border:1px solid var(--line2);border-radius:14px;background:var(--card2);padding:14px;margin-top:12px;animation:fade .25s}
.det h4{font-size:14px;margin-bottom:4px}
.det h5{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:12px 0 4px}
.det p{font-size:12.5px;color:var(--tx2)}
.empty{border:1.5px dashed var(--line2);border-radius:16px;padding:26px 18px;text-align:center;color:var(--tx3);font-size:12.5px}
.empty b{display:block;color:var(--tx2);font-size:13px;margin-bottom:4px}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
.tl{position:relative;margin:0;padding:0 0 0 16px;list-style:none;border-left:2px solid var(--line2)}
.tl li{position:relative;padding:0 0 12px 8px;font-size:12.5px;color:var(--tx2)}
.tl li:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
.tl li.fut:before{background:var(--amb)}
.tl b{color:var(--tx);font-weight:600;margin-right:6px}
.ach td.c,.ach th.c{text-align:center}
.cc{display:inline-block;min-width:24px;padding:2px 0;border-radius:6px;font-weight:700;font-size:11px;color:#fff}
.cc.C{background:#16a34a}.cc.I{background:#dc2626}.cc.N{background:var(--line2);color:var(--tx2)}
.foot{margin:26px auto 0;max-width:1000px;padding:0 16px;font-size:10.5px;color:var(--tx3);text-align:center}
.nonprint{}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  *{animation:none!important;transition:none!important}
  :root,html[data-theme=dark]{--bg:#fff;--bg2:#fff;--card:#fff;--card2:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;--tx:#0f172a;--tx2:#334155;--tx3:#64748b;--shadow:none}
  .hdr,nav,.nonprint{position:static!important}nav,.nonprint{display:none!important}
  .tab{display:block!important;page-break-before:always}.tab:first-of-type{page-break-before:auto}
  .card{break-inside:avoid;box-shadow:none}body{padding:0}
}
.hdr img.lg-light{display:none}html[data-theme=light] .hdr img.lg-dark{display:none}html[data-theme=light] .hdr img.lg-light{display:block}@media print{.hdr img.lg-dark{display:none!important}.hdr img.lg-light{display:block!important}}
.grid>*{min-width:0}.kpi .v{overflow-wrap:anywhere}@media(max-width:480px){.kpi .v{font-size:22px}}

.sent3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sent3 .st{text-align:center;border-radius:14px;padding:14px 8px}
.sent3 .nm{font-weight:700;margin-top:2px}.sent3 .pc{font-size:30px;font-weight:800;line-height:1.1}.sent3 .ct{font-size:11.5px;color:var(--tx2);margin-top:6px}.sent3 .me{font-size:10.5px;color:var(--tx3)}
.selcap{border:1px solid var(--line2);border-radius:12px;background:var(--card2);padding:10px 12px;margin-top:10px;font-size:12.5px;color:var(--tx2)}
@media(max-width:760px){
 .hdr{position:static;padding:8px 12px}nav{top:0}
 .hdr .badge{display:block;white-space:normal;font-size:9px;letter-spacing:.03em;line-height:1.3}.hdr .l{flex:1}.hdr h1{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
 #t-resumen.on{display:flex;flex-direction:column}#t-resumen .sentwrap{order:-1;margin:0 0 14px!important}
 main{padding:12px}
}
@media(max-width:560px){
 .sentwrap .card{padding:10px}.sent3{gap:6px}.sent3 .st{padding:8px 3px}.sent3 .fc svg{width:24px;height:24px}.sent3 .nm{font-size:12px}.sent3 .pc{font-size:21px}.sent3 .ct{font-size:10px;margin-top:3px}.sent3 .me{font-size:9px}
}
.sentwrap .tot{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}.sentwrap .tot b{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}.sentwrap .tot span{font-size:12px;color:var(--tx2)}
:root{--c-JRL:#c23a52;--c-AMT:#6d8cff;--c-SP:#a78bfa}html[data-theme=light]{--c-JRL:#7a1431;--c-AMT:#1e3a8a;--c-SP:#7c3aed}@media print{:root,html[data-theme=dark]{--c-JRL:#7a1431;--c-AMT:#1e3a8a;--c-SP:#7c3aed}}
</style>
</head>

function MODS_ALL(){Object.keys(MODS).forEach(function(id){if($('#t-'+id)&&!done[id]){try{MODS[id].render($('#t-'+id))}catch(e){}done[id]=1}})}
$('#bLoad').onclick=function(){$('#fLoad').click()};
$('#fLoad').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{D=JSON.parse(r.result);M=D.meta||{};ACT=D.actores||[];blank=!!M.en_blanco||!ACT.length;build()}catch(x){alert('El archivo no es un JSON válido del radar.')}};r.readAsText(f)};
addEventListener('hashchange',function(){var id=(location.hash||'').slice(1);if(MODS[id]&&id!==cur&&$('#t-'+id))go(id)});
var q=new URLSearchParams(location.search).get('data');
if(q){fetch(q).then(function(r){return r.json()}).then(function(j){D=j;M=D.meta||{};ACT=D.actores||[];blank=!!M.en_blanco||!ACT.length;build()}).catch(function(){build()})}else build();
window.DQ={go:go,data:function(){return D}};
})();
</script>
